layouts:
  images:
    dark_suffix: .dark # dark variant of an image: `screenshot.dark.png` alongside `screenshot.png`
    mobile_suffix: .mobile # mobile variant of an image: `screenshot.mobile.png` alongside `screenshot.png`
    mobile_media_query: '(max-width: 767px)' # below the Tailwind `md` breakpoint
# Theme options
applanding:
  buttons: []        # list of buttons: `{name: <name>, url: <url>, image: <image path or URL>}`
  source: ''         # URL of the source code: "Source" link and GitHub icon in the header
  documentation: ''  # URL of the documentation: "Documentation" link
  demo: ''           # URL of the demo: "Demo" link, and link of the screenshot
  screenshot: ''     # image displayed next to the baseline (path in `assets/` or URL)
